eureka.client.serviceUrl.defaultZone=http://localhost:8762/eureka
spring.application.name=api-gateway
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway.route.RouterDefinitionLocator=INFO
logging.level.org.springframework.cloud.gateway=TRACE

##product service route
spring.cloud.gateway.routes[0].id=easy-product
spring.cloud.gateway.routes[0].uri=lb://easy-product
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/product/**

##order service route
spring.cloud.gateway.routes[1].id=easy-order
spring.cloud.gateway.routes[1].uri=lb://order-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/order/**

##Api Gateway route
spring.cloud.gateway.routes[2].id=api-gateway
spring.cloud.gateway.routes[2].uri=http://localhost:8762
spring.cloud.gateway.routes[2].predicates[0]=Path=/eureka/web
spring.cloud.gateway.routes[2].filters[0]=SetPath=/

##Api Gateway static resources route
spring.cloud.gateway.routes[3].id=api-gateway-static
spring.cloud.gateway.routes[3].uri=http://localhost:8762
spring.cloud.gateway.routes[3].predicates[0]=Path=/eureka/**